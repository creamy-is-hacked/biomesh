schema_version = 1
campaign_id = "p2-wp06-calibration-required"
purpose = "P2-WP06 replicated experiment matrix; resolve every unknown before scientific execution"
calibration_status = "CALIBRATION_REQUIRED"
confidence_level = 0.95
seeds = [101, 202, 303]
biological_parameter_files = [
  "../parameters/p1_core_model.toml",
  "../parameters/p2_quorum_signal.toml",
  "../parameters/p2_eps_model.toml",
  "../parameters/p2_physiological_states.toml",
  "../parameters/p2_waste_shear.toml",
]

[[conditions]]
condition_id = "producer-monoculture"
family = "producer_monoculture"
producer_fraction = 1.0
inoculation_pattern = "intermixed"
eps_control = "quorum_controlled"
notes = "Producer-only control required by P2-WP06."

[[conditions]]
condition_id = "nonproducer-monoculture"
family = "nonproducer_monoculture"
producer_fraction = 0.0
inoculation_pattern = "intermixed"
eps_control = "quorum_controlled"
notes = "Nonproducer-only control required by P2-WP06."

[[conditions]]
condition_id = "competition-50-50"
family = "competition_50_50"
producer_fraction = 0.5
inoculation_pattern = "intermixed"
eps_control = "quorum_controlled"
notes = "Equal initial producer and nonproducer fraction required by P2-WP06."

[[conditions]]
condition_id = "inoculation-intermixed"
family = "inoculation_pattern"
producer_fraction = 0.5
inoculation_pattern = "intermixed"
eps_control = "quorum_controlled"
notes = "Intermixed categorical inoculation pattern; spatial realization is runner-owned."

[[conditions]]
condition_id = "inoculation-segregated"
family = "inoculation_pattern"
producer_fraction = 0.5
inoculation_pattern = "segregated"
eps_control = "quorum_controlled"
