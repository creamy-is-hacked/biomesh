name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes libgl1 libegl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" hatchling
      - run: python -m biomesh --help
      - run: python -m biomesh --version
      - run: biomesh-gui --version
      - run: python -m biomesh validate all
      - run: QT_QPA_PLATFORM=offscreen biomesh-gui --smoke-test
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - run: git diff --check
      - name: Build wheel and sdist
        run: python -m hatchling build --clean -d dist
      - name: Install and smoke-test wheel and sdist outside the repository
        run: |
          package_root="$(mktemp -d)"
          for package_artifact in dist/*.whl dist/*.tar.gz; do
            package_name="$(basename "$package_artifact")"
            package_env="$package_root/${package_name//[^A-Za-z0-9]/_}"
            python -m venv "$package_env"
            "$package_env/bin/python" -m pip install "$package_artifact"
            (
              cd "$package_root"
              test "$("$package_env/bin/biomesh" --version)" = "biomesh 0.2.1"
              "$package_env/bin/biomesh" validate all
              "$package_env/bin/biomesh" experiment experiments/producer.yaml \
                --output "$package_root/output-${package_name//[^A-Za-z0-9]/_}"
              QT_QPA_PLATFORM=offscreen "$package_env/bin/biomesh-gui" --smoke-test
              test "$("$package_env/bin/biomesh-gui" --version)" = "biomesh-gui 0.2.1"
            )
          done
      - name: Build and install the Linux application bundle
        run: |
          python -m biomesh package linux --wheel dist/*.whl \
            --output dist/linux-installer
          bundle_root="$(mktemp -d)"
          tar -xzf dist/linux-installer/*.tar.gz -C "$bundle_root"
          installer="$(find "$bundle_root" -type f -name install.sh -print)"
          bash -n "$installer"
          "$installer" --prefix "$bundle_root/prefix" \
            --python "$(command -v python)" --no-deps
          (
            cd "$bundle_root"
            test "$("$bundle_root/prefix/bin/biomesh" --version)" = \
              "biomesh 0.2.1"
            "$bundle_root/prefix/bin/biomesh" validate all
            QT_QPA_PLATFORM=offscreen \
              "$bundle_root/prefix/bin/biomesh-gui" --smoke-test
          )
      - name: Reproduce a portable project from the installed Linux bundle
        run: |
          archive_root="$(mktemp -d)"
          python -m biomesh project create validation/p4_wp06/project.json \
            "$archive_root/source-project"
          python -m biomesh campaign resume "$archive_root/source-project" \
            portable-campaign
          python -m biomesh project export "$archive_root/source-project" \
            --output "$archive_root/project.biomesh"
          installer="$(find dist/linux-installer -type f -name '*.tar.gz' -print)"
          extract_root="$(mktemp -d)"
          tar -xzf "$installer" -C "$extract_root"
          install_script="$(find "$extract_root" -type f -name install.sh -print)"
          "$install_script" --prefix "$extract_root/prefix" \
            --python "$(command -v python)" --no-deps
          (
            cd "$archive_root"
            "$extract_root/prefix/bin/biomesh" project verify-archive \
              project.biomesh
            "$extract_root/prefix/bin/biomesh" project import project.biomesh \
              imported-project
            "$extract_root/prefix/bin/biomesh" campaign status \
              imported-project portable-campaign
          )
