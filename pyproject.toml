[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biomesh"
version = "0.2.1"
description = "BioMesh bacterial biofilm simulation research platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "matplotlib",
  "numba",
  "numpy",
  "pyarrow",
  "pyqtgraph>=0.14.0",
  "PySide6>=6.10.1",
  "pydantic",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[project.scripts]
biomesh = "biomesh.__main__:main"
biomesh-gui = "biomesh.gui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biomesh"]

[tool.hatch.build.targets.wheel.force-include]
experiments = "biomesh/resources/experiments"
parameters = "biomesh/resources/parameters"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.14"
strict = true
warn_unused_configs = true
